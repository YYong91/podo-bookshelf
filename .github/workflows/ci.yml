name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify-test-start:
    name: Notify Test Start
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          BRANCH="${{ github.head_ref }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🧪 podo-bookshelf CI 시작 (${BRANCH})"

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          uv sync --all-extras

      - name: Lint
        run: |
          cd backend
          uv run ruff check app/
          uv run ruff format --check app/

      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          JWT_SECRET: test-secret-key
          AUTH_SERVER_URL: http://localhost:3000
        run: |
          cd backend
          uv run pytest tests/ -v --tb=short --cov=app --cov-report=term --cov-report=json

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.json
          retention-days: 7

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linter
        run: |
          cd frontend
          npm run lint

      - name: Run tests
        run: |
          cd frontend
          npm run test:run

      - name: Build
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: /api
          VITE_AUTH_URL: https://auth.podonest.com
          VITE_AUTH_CALLBACK_URL: http://localhost:3100/auth/callback
          VITE_BUDGET_URL: https://budget.podonest.com

  notify-test-result:
    name: Notify Test Result
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKEND_STATUS: ${{ needs.test-backend.result }}
          FRONTEND_STATUS: ${{ needs.test-frontend.result }}
        run: |
          PROJECT="podo-bookshelf"
          BRANCH="${{ github.head_ref }}"
          if [ "$BACKEND_STATUS" = "success" ] && [ "$FRONTEND_STATUS" = "success" ]; then
            MSG="✅ ${PROJECT} CI 통과 (${BRANCH})"
          else
            FAILURES=""
            [ "$BACKEND_STATUS" != "success" ] && FAILURES="backend"
            [ "$FRONTEND_STATUS" != "success" ] && FAILURES="${FAILURES:+${FAILURES} + }frontend"
            MSG="❌ ${PROJECT} CI 실패 (${BRANCH}) — ${FAILURES}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
