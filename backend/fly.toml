# Fly.io 배포 설정 - podo-bookshelf backend
app = "podo-bookshelf-backend"
primary_region = "nrt"  # 도쿄

[build]

[deploy]
  release_command = "uv run alembic upgrade head"

[env]
  PORT = "8001"
  DATABASE_URL = "sqlite+aiosqlite:////app/data/podo.db"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "120s"
    interval = "15s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = "bookshelf_data"
  destination = "/app/data"
