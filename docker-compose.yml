services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    volumes:
      - podo-data:/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/podo.db
      - CORS_ORIGINS=*
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  podo-data:
